<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BISONX - Area de Download</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#070b1a;--card:#0f1630;--card2:#141d40;--border:#223065;--text:#e9edff;--muted:#93a2d4;--cyan:#22d3ee;--green:#34d399;--red:#f87171;--gold:#fbbf24}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,Roboto,Arial,sans-serif;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(700px 400px at 85% -10%,rgba(34,211,238,.16),transparent 60%),radial-gradient(600px 400px at 10% 110%,rgba(232,121,249,.10),transparent 60%),var(--bg)}
.box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:40px 34px;max-width:520px;width:92%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo{font-size:1.5rem;font-weight:800;letter-spacing:1px;margin-bottom:6px}
.logo span{color:var(--cyan)}
.sub{color:var(--muted);font-size:.95rem;margin-bottom:26px}
label{display:block;text-align:left;color:var(--muted);font-size:.85rem;margin-bottom:6px;font-weight:600}
input{width:100%;padding:14px 16px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:1rem;letter-spacing:1px;text-align:center;outline:none;font-family:Consolas,monospace}
input:focus{border-color:var(--cyan)}
.btn{display:block;width:100%;margin-top:14px;padding:14px;border-radius:10px;border:none;font-weight:800;font-size:1rem;cursor:pointer;background:linear-gradient(90deg,var(--cyan),#60a5fa);color:#062a33}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.msg{margin-top:18px;padding:14px;border-radius:10px;font-size:.95rem;display:none}
.msg.ok{display:block;background:rgba(52,211,153,.12);border:1px solid var(--green);color:var(--green)}
.msg.erro{display:block;background:rgba(248,113,113,.12);border:1px solid var(--red);color:var(--red)}
.msg.aviso{display:block;background:rgba(251,191,36,.10);border:1px solid var(--gold);color:var(--gold)}
.dl{display:inline-block;margin-top:14px;padding:16px 32px;border-radius:12px;font-weight:800;text-decoration:none;background:linear-gradient(90deg,var(--cyan),var(--green));color:#062a33;font-size:1.05rem}
.dl:hover{filter:brightness(1.1)}
.dica{color:var(--muted);font-size:.8rem;margin-top:20px}
.dica b{color:var(--green)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="box">
  <div class="logo">BISONX <span>SINAIS PRO</span></div>
  <div class="sub">Area de download seguro. Digite o codigo de liberacao<br>que o vendedor enviou apos a confirmacao do pagamento.</div>
  <label for="cod">Codigo de liberacao</label>
  <input id="cod" type="text" autocomplete="off" inputmode="text" placeholder="BX-00000000-XXXXXX" maxlength="24">
  <button class="btn" id="btn" onclick="liberar()">Liberar meu download</button>
  <div class="msg" id="msg"></div>
  <div id="area"></div>
  <div class="dica">Depois de baixar, digite a chave de licenca para <b>ativar o motor</b>.<br>Duvidas? Fale com o vendedor no WhatsApp.</div>
</div>
<script src="codigos.js"></script>
<script>
async function sha256hex(s){
  try{
    const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ return ''; }
}
window.addEventListener('load', function(){
  var p = new URLSearchParams(window.location.search).get('c');
  if(p){
    document.getElementById('cod').value = p;
    document.getElementById('btn').click();
  }
});
async function liberar(){
  const m = document.getElementById('msg');
  const a = document.getElementById('area');
  const btn = document.getElementById('btn');
  const cod = document.getElementById('cod').value.trim().toLowerCase();
  btn.disabled = true;
  a.innerHTML = '';
  m.className = 'msg aviso'; m.textContent = 'Verificando codigo...'; m.style.display='block';
  if(!cod){ m.className='msg erro'; m.textContent='Digite o codigo de liberacao.'; m.style.display='block'; btn.disabled=false; return; }
  const hash = await sha256hex(cod);
  const prefixo = hash.slice(0,8);
  const ativo = (typeof CODIGOS_ATIVOS !== 'undefined') && CODIGOS_ATIVOS.includes(prefixo);
  if(ativo){
    m.className='msg ok'; m.textContent='Codigo validado! Download liberado.'; m.style.display='block';
    a.innerHTML = '<a class="dl" href="sinais_pro_'+prefixo+'.exe" download>BAIXAR SINAIS PRO</a><div class="dica" style="margin-top:8px">Arquivo unico, gerado exclusivamente para o seu codigo.</div>';
  }else{
    m.className='msg erro';
    m.textContent='Codigo invalido ou ainda nao liberado. Confira com o vendedor se o pagamento foi confirmado.';
    m.style.display='block';
  }
  btn.disabled=false;
}
</script>
</body>
</html>
